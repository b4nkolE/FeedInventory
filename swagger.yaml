openapi: 3.0.0
info:
  title: Poultry Farm Inventory & Traceability API
  version: 1.0.0
  description: Master API documentation for the farm's backend system, reflecting the merged Users and Authentication routing architecture.
servers:
  - url: http://localhost:8000
    description: Local Development Server
  - url:  https://gbenroglobalsynergyltd.onrender.com
    description: Production Server

# ---------------------------------------------------------
# COMPONENTS & SCHEMAS
# ---------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        role:
          type: string
          enum: [ADMIN, MANAGER, STAFF]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    FeedItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        categoryId:
          type: string
          description: UUID of the associated Category
        currentStock:
          type: integer
        pricePerUnit:
          type: number

    Transaction:
      type: object
      properties:
        id:
          type: string
        feedItemId:
          type: string
        userId:
          type: string
        type:
          type: string
          enum: [IN, OUT]
        quantity:
          type: integer
        reference:
          type: string
        notes:
          type: string
        date:
          type: string
          format: date-time

    SaleItem:
      type: object
      properties:
        id:
          type: string
        saleId:
          type: string
        feedItemId:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        totalPrice:
          type: number
        feedItem:
          type: object
          properties:
            name:
              type: string

    Sale:
      type: object
      properties:
        id:
          type: string
        receiptNumber:
          type: string
          example: "GGS-2026-0001"
        totalPrice:
          type: number
        buyerName:
          type: string
        notes:
          type: string
        date:
          type: string
          format: date-time
        userId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/SaleItem'

# ---------------------------------------------------------
# PATHS (ROUTES)
# ---------------------------------------------------------
paths:
  # ================= USERS & AUTHENTICATION =================
  /api/v1/users/signup:
    post:
      summary: Register a new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                phoneNumber:
                  type: string
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Bad request (missing fields or email taken)

  /api/v1/users/signin:
    post:
      summary: Login a user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid email or password
        '403':
          description: Account deactivated

  /api/v1/users/me:
    get:
      summary: Get the currently logged-in user profile
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Returns clean profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/users/forgot-password:
    post:
      summary: Request a password reset code
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  example: "user@example.com"
      responses:
        '200':
          description: Reset code sent (returns same message even if email not found, for security)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "If an account with that email exists, a reset code has been sent."
        '400':
          description: Email is required
        '500':
          description: Internal server error

  /api/v1/users/reset-password:
    post:
      summary: Reset password using the emailed code
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email:
                  type: string
                  example: "user@example.com"
                code:
                  type: string
                  description: The 6-digit code received via email
                  example: "482917"
                newPassword:
                  type: string
                  description: Must be at least 6 characters
                  example: "myNewSecurePassword"
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password reset successfully. You can now sign in with your new password."
        '400':
          description: Invalid or expired code, missing fields, or password too short
        '500':
          description: Internal server error

  /api/v1/users/refresh-token:
    post:
      summary: Refresh an expired access token
      description: >
        Accepts a valid refresh token and returns a new short-lived access token.
        The refresh token itself is not rotated. If the user's account has been
        deactivated or deleted since the refresh token was issued, the request
        will be rejected with a 403.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  description: The long-lived refresh token received during sign-up or sign-in
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: New access token issued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Token refreshed successfully."
                  token:
                    type: string
                    description: A new short-lived JWT access token
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '401':
          description: Refresh token was not provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Refresh token is required."
        '403':
          description: Refresh token is invalid, expired, or the account is deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or expired refresh token. Please sign in again."

  /api/v1/users:
    get:
      summary: Get all users (Managers & Admins only)
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /api/v1/users/profile:
    put:
      summary: Update own user profile
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                phoneNumber:
                  type: string
      responses:
        '200':
          description: Profile updated successfully

  /api/v1/users/{id}:
    delete:
      summary: Delete a user by ID (Hierarchy Rules Apply)
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted successfully
        '403':
          description: Permission denied due to role hierarchy
        '404':
          description: User not found

  # ================= INVENTORY & TRANSACTIONS =================
  /api/v1/inventory/feeds:
    get:
      summary: Get all feed items in the catalog (Paginated)
      tags: [Inventory Catalog]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Number of items per page
        - in: query
          name: search
          schema:
            type: string
          description: Filter feeds by name (case-insensitive partial match)
        - in: query
          name: categoryId
          schema:
            type: string
          description: Filter feeds by category UUID
      responses:
        '200':
          description: Returns paginated feed catalog with metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      totalRecords:
                        type: integer
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      pageSize:
                        type: integer
                      hasNextPage:
                        type: boolean
                      hasPrevPage:
                        type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeedItem'
        '500':
          description: Internal server error
    post:
      summary: Create a new feed product
      tags: [Inventory Catalog]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, categoryId, pricePerUnit]
              properties:
                name:
                  type: string
                categoryId:
                  type: string
                  description: UUID of an existing Category
                pricePerUnit:
                  type: number
      responses:
        '201':
          description: Feed product created

  /api/v1/inventory/feeds/{id}:
    get:
      summary: Get a specific feed item by ID
      tags: [Inventory Catalog]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns the specific feed
        '404':
          description: Feed item not found
    put:
      summary: Update a specific feed item
      tags: [Inventory Catalog]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                categoryId:
                  type: string
                  description: UUID of an existing Category
                pricePerUnit:
                  type: number
      responses:
        '200':
          description: Feed item updated

  /api/v1/inventory/transaction:
    post:
      summary: Record an IN or OUT transaction (Single or Multi-Item Sales)
      description: >
        Records inventory movements.
        - **IN**: Requires `feedItemId`, `quantity`, and `type: "IN"`. Increments stock level.
        - **OUT**: Supports multi-item sales (`items: [{ feedItemId, quantity }]`) or single item (`feedItemId`, `quantity`).
          Reduces stock atomically across all items in a transaction block and generates a sales receipt.
      tags: [Traceability Ledger]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [IN, OUT]
                  example: "OUT"
                feedItemId:
                  type: string
                  description: Required for IN transactions, or single-item OUT transaction fallback.
                  example: "a1b2c3d4-5678-90ef-ghij-klmnopqrstuv"
                quantity:
                  type: integer
                  description: Required for IN transactions, or single-item OUT transaction fallback.
                  example: 10
                items:
                  type: array
                  description: Array of items for multi-item OUT sales transactions.
                  items:
                    type: object
                    required: [feedItemId, quantity]
                    properties:
                      feedItemId:
                        type: string
                        example: "a1b2c3d4-5678-90ef-ghij-klmnopqrstuv"
                      quantity:
                        type: integer
                        example: 5
                reference:
                  type: string
                  example: "POS-REF-9921"
                buyerName:
                  type: string
                  example: "John Doe Farms"
                notes:
                  type: string
                  example: "Customer requested receipt via WhatsApp"
      responses:
        '201':
          description: Transaction recorded and stock updated atomically
        '400':
          description: Insufficient stock, unpriced feed item, or invalid parameters
        '404':
          description: Feed item not found

  /api/v1/inventory/transactions:
    get:
      summary: Get the master transaction ledger (Paginated)
      tags: [Traceability Ledger]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Number of items per page
        - in: query
          name: type
          schema:
            type: string
            enum: [IN, OUT]
        - in: query
          name: feedItemId
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Returns paginated ledger with metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      totalRecords:
                        type: integer
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      pageSize:
                        type: integer
                      hasNextPage:
                        type: boolean
                      hasPrevPage:
                        type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'

  /api/v1/inventory/receipts:
    get:
      summary: Get all sale receipts (Paginated)
      tags: [Traceability Ledger]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: feedItemId
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Returns paginated receipts with metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sale'

  /api/v1/inventory/receipts/{id}:
    get:
      summary: Get a specific receipt by ID
      tags: [Traceability Ledger]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns structured receipt details
        '404':
          description: Receipt not found

  /api/v1/inventory/receipts/{id}/download:
    get:
      summary: Download a receipt as a PDF
      description: >
        Generates and streams a professionally formatted PDF receipt for the
        given sale ID. The response is a downloadable PDF file with
        Content-Disposition set to attachment.


        **Two layout formats are available:**

        - **standard** (default) — A4 corporate-style receipt with a branded
          header band, colour-coded table, and full-width layout.

        - **thermal** — Supermarket-style 80mm thermal receipt optimised for
          POS printers. Uses a compact layout (226.77 pt width) with dashed
          dividers, centred headers, and dynamic page height calculated from
          item name wrapping, buyer details, and notes length. Prices are
          rendered with the Naira (₦) symbol.
      tags: [Traceability Ledger]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The UUID of the sale/receipt to download
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [standard, thermal]
            default: standard
          description: >
            The PDF layout format.
            Use `standard` for an A4 corporate receipt (default).
            Use `thermal` for an 80mm POS / supermarket-style thermal receipt.
          example: thermal
      responses:
        '200':
          description: PDF file streamed successfully
          headers:
            Content-Disposition:
              description: >
                Attachment header with the generated filename, e.g.
                `attachment; filename="receipt-GGS-2026-0001.pdf"`
              schema:
                type: string
                example: 'attachment; filename="receipt-GGS-2026-0001.pdf"'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Receipt not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Receipt not found."
        '500':
          description: Failed to generate receipt PDF
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Failed to generate receipt PDF."

  # ================= ANALYTICS =================
  /api/v1/analytics/summary:
    get:
      summary: Get high-level dashboard metrics
      tags: [Analytics]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Returns total bags, daily sales, and low stock items

  /api/v1/analytics/top-selling:
    get:
      summary: Get leaderboard of top selling feeds
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
          description: Limit number of results (defaults to 5)
      responses:
        '200':
          description: Returns ranked list of feeds by OUT volume

  /api/v1/analytics/admin/manager-actions:
    get:
      summary: Audit log of manager actions (Admin only)
      tags: [Analytics]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Returns transactions executed by managers

  # ================= CATEGORIES =================
  /api/v1/category/createCategories:
    post:
      summary: Create a new feed category
      tags: [Categories]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "NEW_STARTER_MASH"
      responses:
        '201':
          description: Category created successfully
        '400':
          description: Category name already exists

  /api/v1/category/updateCategories/{id}:
    put:
      summary: Update a category's name
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "CORRECTED_NAME"
      responses:
        '200':
          description: Category updated successfully
        '400':
          description: Name already taken
        '404':
          description: Category not found

  /api/v1/category/getCategories:
    get:
      summary: Get all feed categories (optimized for frontend dropdowns)
      tags: [Categories]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully fetched all categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "a1b2c3d4-5678-90ef-ghij-klmnopqrstuv"
                    name:
                      type: string
                      example: "FISH_FEED"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Failed to fetch categories"

  /api/v1/category/getCategories/{id}:
    get:
      summary: Get a specific category by ID (includes its feed items)
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The UUID of the category
      responses:
        '200':
          description: Successfully fetched category details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                     type: string
                  name:
                     type: string
                  feedItems:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        currentStock:
                          type: integer
        '400':
          description: Invalid category ID format
        '404':
          description: Category not found

  /api/v1/category/deleteCategories/{id}:
    delete:
      summary: Delete a category (Restricted if in use)
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category deleted successfully
        '403':
          description: Action blocked - Category is currently in use by feed items
        '404':
          description: Category not found
